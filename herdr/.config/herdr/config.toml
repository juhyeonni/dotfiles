# herdr — terminal multiplexer. Hierarchy: workspace > tab > pane.
# Defaults: `herdr --default-config`. Validate with `herdr config check`.
# After editing, run `herdr server reload-config` — it does not watch the file.

[theme]
name = "kanagawa"

[keys]
prefix = "ctrl+a"
split_horizontal = ["prefix+minus", "prefix+s"]  # brings back tmux's prefix+s
settings = "prefix+comma"                        # moved here after giving up prefix+s

# Workspace (space) switching — all three are empty by default, so the picker
# (prefix+w) and navigate mode (prefix+g) were the only ways to move.
# Keep the numbering consistent: prefix+1..9 = tab, prefix+shift+1..9 = space.
# The sidebar is a vertical list, so j/k match the direction of travel.
# Tab switching is carried over verbatim from tmux's `bind -r C-h/C-l select-window`.
# Pane switching (prefix+hjkl) already matches tmux by default, so it is untouched —
# giving tabs the same h/l would collide with panes, so tabs add ctrl.
#
# herdr has no equivalent of tmux's `bind -r` (repeat). Every prefix binding needs
# the prefix retyped, so prefix-less ctrl+alt+h/l is kept alongside for repeat presses.
# Note: direct bindings are swallowed by herdr and never reach the app inside the pane.
previous_tab = ["prefix+p", "prefix+ctrl+h", "ctrl+alt+h"]
next_tab = ["prefix+n", "prefix+ctrl+l", "ctrl+alt+l"]

switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+shift+k"
next_workspace = "prefix+shift+j"

# Agent switching — also empty by default. Navigate mode (prefix+g) draws a cursor in
# the sidebar, but its motion keys only cover workspaces and panes, never the agents row.
# Modifiers pick the target: shift = space, alt = agent.
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# `description` is the name shown in the prefix+? help instead of "custom command".
# The "popup" label on the popup border is hardcoded by herdr and not configurable.
# Project entry point (replaces sesh).
# switch_ascii_input_source_in_prefix does not cover alt+s — it only switches to ASCII
# *inside* prefix mode, and alt+s never goes through the prefix. Korean IME handling is
# therefore done by forceEnglishKeys in hammerspoon init.lua (switches to English on press).
# Left option only — Karabiner claims the right one as f17 (Korean/Japanese toggle).
[[keys.command]]
key = ["prefix+shift+s", "alt+s", "ctrl+alt+s"]
type = "popup"
command = "~/.config/herdr/scripts/workspace-jump.sh"
description = "workspace"
width = "60%"
# ~17 rows on a 47-row pane. The tallest mode, [all] (11 list rows + 2 header + counter +
# prompt), fits exactly. Any taller and the top goes blank, since fzf aligns to the bottom.
height = "40%"

# lazygit/scratch use alt combos because prefix+g is goto and prefix+shift+g is new_worktree.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+c"
type = "popup"
command = "claude"
description = "claude"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "$SHELL"
description = "shell"
width = "80%"
height = "75%"

# tmux's break-pane. herdr has no pane-move action under [keys], only in the CLI.
# It is the inverse of split (prefix+v), so it adds shift — prefix+shift+s was already taken by the workspace popup.
# The server knows the focused pane, so `pane current` resolves the id without any env var.
# Grouped under v: v = split, shift+v = break out, alt+v = join back.
[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "herdr pane move $(herdr pane current | jq -r .result.pane.pane_id) --new-tab --focus"
description = "break pane"

# join-pane. Needs a tab picker, so popup + fzf. The list is short, so the popup is small.
[[keys.command]]
key = "prefix+alt+v"
type = "popup"
command = "~/.config/herdr/scripts/pane-join.sh"
description = "join pane"
width = "40%"
height = "40%"

[ui]
# The only confirmation prompt herdr has. close_tab / close_pane have none.
confirm_close = true

[ui.toast]
# Delegated to the outer terminal (Ghostty). `system` pulls in terminal-notifier and
# fires on the wrong machine under --remote. Clicking it does not jump to the pane — use prefix+o.
delivery = "terminal"

[ui.sound]
enabled = true

[session]
# Requires `herdr integration install claude` to have been run.
resume_agents_on_restore = true

[experimental]
# Makes the prefix work on a Korean keyboard layout. No side effects.
switch_ascii_input_source_in_prefix = true

# Enable both when the IME candidate window fails to follow the cursor while typing Korean in Claude Code.
# The cost is an extra visible cursor in e.g. vim normal mode, so the scope is narrowed to agents.
# reveal_hidden_cursor_for_cjk_ime = true
# cjk_ime_agents = ["claude"]
